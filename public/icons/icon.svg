<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Compass / Orbit Ring -->
  <circle cx="64" cy="64" r="38" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.4"/>

  <!-- Central Primary AI Sparkle (Sahayak 4-point star) -->
  <path d="M64 26 C64 45 64 45 45 64 C64 64 64 64 64 102 C64 64 64 64 83 64 C64 45 64 45 64 26 Z" fill="url(#sparkleGrad)" filter="url(#glow)"/>

  <!-- Secondary Satellite Sparkle (Top Right) -->
  <path d="M88 34 C88 40 88 40 82 46 C88 46 88 46 88 58 C88 46 88 46 94 46 C88 40 88 40 88 34 Z" fill="#38bdf8"/>

  <!-- Tertiary Accent Sparkle (Bottom Left) -->
  <path d="M38 78 C38 82 38 82 34 86 C38 86 38 86 38 94 C38 86 38 86 42 86 C38 82 38 82 38 78 Z" fill="#facc15"/>

  <!-- Center Glow Dot -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff"/>
</svg>

